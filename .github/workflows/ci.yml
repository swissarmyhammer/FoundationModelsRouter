name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The real-model suites are selected by PACKAGE, never by an environment
# variable and never by a name regex. The root package declares no integration
# target, so `swift test` at the root runs only the hermetic targets
# (`FoundationModelsRouterTests`, `FoundationModelsRouterEvals`) by
# construction. The nested `IntegrationTests/` package holds the two
# real-model targets (`FoundationModelsRouterIntegrationTests`,
# `FoundationModelsRouterEvalIntegrationTests`), and
# `swift test --package-path IntegrationTests` runs them. A run of a package
# executes every suite in it, so neither command can silently match nothing —
# the guard script the name-regex selectors needed is gone with them.
jobs:
  test:
    name: Build & hermetic tests
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Clean build directory
        run: rm -rf .build

      - name: Build (incl. tests)
        run: swift build --build-tests

      - name: Run the hermetic tests
        run: swift test

  real-model:
    name: Real-model tests
    # After the hermetic job, and not beside it: both run on the self-hosted
    # macOS pool, and a real-model run holds a multi-gigabyte model resident on
    # the GPU for the whole of it. A hermetic failure also costs nothing to
    # learn before that half hour is spent.
    needs: test
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Clean build directory
        run: rm -rf .build IntegrationTests/.build

      - name: Build (incl. tests)
        run: swift build --build-tests --package-path IntegrationTests

      # The whole-dataset fact-retention tier is a superset of the subset tier
      # this run measures, and its own limit is two hours, so it is stepped
      # aside by name. Ask for it with
      # `swift test --package-path IntegrationTests --filter CompactionEvalFullDataset`.
      #
      # No metallib is copied beside the test bundle here, as the shared
      # workflow used to do: `MetalLibraryTestBootstrap` installs that link from
      # inside each real-model process, and `MetalLibraryBootstrapIntegrationTests`
      # is the suite that proves the shaders load.
      - name: Run the real-model tests
        run: |
          swift test \
            --package-path IntegrationTests \
            --skip CompactionEvalFullDataset
