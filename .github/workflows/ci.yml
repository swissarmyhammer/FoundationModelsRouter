name: CI

# This workflow calls the shared swift-ci workflow. It runs no repo-local
# test job of its own.
#
# The unit/integration split is structural. The root `Package.swift` declares
# no integration target. The real-model suites live in the nested
# `IntegrationTests/` package (`FoundationModelsRouterIntegrationTests` and
# `FoundationModelsRouterEvalIntegrationTests`), so `swift test` at the root
# cannot reach them, and `swift test --package-path IntegrationTests` runs
# them. A run of a package executes every suite in it, so neither command can
# silently match nothing. No environment variable selects a suite, and none
# may start to: this workflow passes no `integration-gate-env` input (a LEGACY
# input, kept only for callers that have not migrated).
#
# The shared workflow does what the two repo-local jobs did before:
#
# - Its unit job builds the nested package on EVERY run. The root build does
#   not compile the nested package, so this build step keeps a broken
#   integration test visible between the runs that execute it.
# - Its integration job builds the nested package and runs
#   `swift test --package-path IntegrationTests`.
# - Its integration job runs after the unit job, through the shared
#   workflow's own `needs:` edge. The two jobs are ordered, not parallel, on
#   purpose: both run on the self-hosted macOS pool, and a real-model run
#   holds a multi-gigabyte model resident on the GPU for the whole of it. A
#   hermetic failure is also cheap to learn before that half hour is spent.
#
# No `integration-metallib-glob` is passed. The shared workflow can copy a
# metallib beside each `.xctest` bundle, but this repository does not need
# that copy: `MetalLibraryTestBootstrap` installs the link from inside each
# real-model process, and `MetalLibraryBootstrapIntegrationTests` is the
# suite that proves the shaders load. Card ^q8gkngy measured on 2026-08-21
# that mlx-swift 0.31.6 (revision 0bb916c6) still aborts without that
# bootstrap, so the bootstrap stays; the header of
# `MetalLibraryTestBootstrap.swift` holds the measurement.
#
# `CIWorkflowTests` pins this call and its input.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # The real-model suites are a nested package. This input makes the unit
      # job build it on every run and makes the integration job run it.
      integration-package-path: IntegrationTests
